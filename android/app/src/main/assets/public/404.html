<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TVBox React</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which will cause the browser to load the correct page without a page refresh.
      
      // If the app is deployed to a sub-folder (e.g. /my-repo/), 
      // set pathSegmentsToKeep to the number of folders (e.g. 1).
      // For GitHub Pages repo sites, this is usually 1.
      var pathSegmentsToKeep = window.location.pathname.split('/').filter(Boolean).length > 0 ? 1 : 0;
      if (window.location.hostname.indexOf('github.io') === -1) {
        pathSegmentsToKeep = 0; // Not on GitHub Pages, assume root
      }

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
